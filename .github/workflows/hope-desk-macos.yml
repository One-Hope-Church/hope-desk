name: Hope Desk macOS build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which app to build (universal arm64 + x86_64 is always built)"
        type: choice
        options: [all, staff, production, manager]
        default: all
      merge:
        description: "Merge arm64 + x86_64 into one universal DMG. Turn OFF for the FALLBACK: separate per-arch DMGs (also runs automatically if the merge job fails)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hope-desk-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  MAC_RUST_VERSION: "1.81" # 1.81 is required for macos, because https://github.com/yury/cidre requires 1.81
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  # Bridge job (mirrors bridge.yml, Flutter 3.22.3 case)
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  bridge:
    name: flutter-rust-bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build:
    name: ${{ matrix.variant }} ${{ matrix.arch }}
    needs: bridge
    runs-on: ${{ matrix.arch == 'aarch64' && 'macos-14' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'all' && '["staff","production","manager"]' || format('["{0}"]', inputs.variant)) }}
        arch: [aarch64, x86_64]
    steps:
      - name: Configure per-variant and per-arch values
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            TARGET="aarch64-apple-darwin"
            FEATURES="flutter,hwcodec,unix-file-copy-paste,screencapturekit"
            MIN_MACOS="12.3"
            XCODE_ARCH="arm64"
            VCPKG_TRIPLET="arm64-osx"
          else
            TARGET="x86_64-apple-darwin"
            FEATURES="flutter,hwcodec,unix-file-copy-paste"
            MIN_MACOS="10.14"
            XCODE_ARCH="x86_64"
            VCPKG_TRIPLET="x64-osx"
          fi
          case "${{ matrix.variant }}" in
            staff)
              FEATURES="${FEATURES},hope-desk-staff"
              APP_PRODUCT="HopeDesk"
              EXPECTED_ID="org.onehopechurch.hopedesk"
              ;;
            production)
              APP_PRODUCT="HopeDeskProduction"
              EXPECTED_ID="org.onehopechurch.hopedesk.production"
              ;;
            manager)
              FEATURES="${FEATURES},hope-desk-manager"
              APP_PRODUCT="HopeDeskManager"
              EXPECTED_ID="org.onehopechurch.hopedesk.manager"
              ;;
          esac
          {
            echo "TARGET=${TARGET}"
            echo "FEATURES=${FEATURES}"
            echo "MIN_MACOS=${MIN_MACOS}"
            echo "XCODE_ARCH=${XCODE_ARCH}"
            echo "VCPKG_TRIPLET=${VCPKG_TRIPLET}"
            echo "APP_PRODUCT=${APP_PRODUCT}"
            echo "EXPECTED_ID=${EXPECTED_ID}"
          } >> "$GITHUB_ENV"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config may already be installed by the runner image
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x from the official release; `brew install nasm` gives incompatible 3.x.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: hope-desk-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${VCPKG_TRIPLET}-rel-out.log" || true

      - name: Apply Hope Desk variant
        run: bash res/hope-desk/apply-variant.sh "${{ matrix.variant }}"

      - name: Set deployment target
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS}'/" flutter/macos/Podfile
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS}" >> "$GITHUB_ENV"

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build Rust
        env:
          HOPE_DESK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cargo build --locked --release --features "$FEATURES"
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib

      - name: Build Flutter app
        working-directory: flutter
        run: |
          FLUTTER_XCODE_ARCHS="$XCODE_ARCH" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES flutter build macos --release

      - name: Assemble bundle
        run: |
          APP_DIR="flutter/build/macos/Build/Products/Release"
          APP="$APP_DIR/$APP_PRODUCT.app"
          test -f "$APP/Contents/MacOS/$APP_PRODUCT"
          if [ "${{ matrix.variant }}" = "production" ]; then
            cp target/release/service "$APP/Contents/MacOS/"
          fi
          PLIST="$APP/Contents/Info.plist"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
            echo "::error::CFBundleIdentifier is '$ACTUAL_ID', expected '$EXPECTED_ID'"
            exit 1
          fi
          if [ "${{ matrix.variant }}" != "production" ] && [ -e "$APP/Contents/MacOS/service" ]; then
            echo "::error::${{ matrix.variant }} bundle must not contain Contents/MacOS/service"
            exit 1
          fi
          if [ "${{ matrix.variant }}" = "production" ] && [ ! -e "$APP/Contents/MacOS/service" ]; then
            echo "::error::production bundle must contain Contents/MacOS/service"
            exit 1
          fi
          echo "CFBundleName: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST" || true)"
          echo "CFBundleDisplayName: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" || true)"
          lipo -archs "$APP/Contents/MacOS/$APP_PRODUCT"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Zip bundle for the merge job
        run: ditto -c -k --keepParent "$APP_DIR/$APP_PRODUCT.app" "$APP_PRODUCT.app.zip"

      - name: Upload intermediate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ env.APP_PRODUCT }}.app.zip
          if-no-files-found: error
          retention-days: 3

  # Per-variant universal merge: arm64 + x86_64 -> one bundle -> one DMG.
  merge:
    name: merge ${{ matrix.variant }}
    needs: build
    if: ${{ inputs.merge }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'all' && '["staff","production","manager"]' || format('["{0}"]', inputs.variant)) }}
    steps:
      - name: Per-variant names
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            staff)      P="HopeDesk";           S="Hope Desk";            V="Hope Desk";            A="Hope-Desk" ;;
            production) P="HopeDeskProduction"; S="HopeDeskProduction";   V="Hope Desk Production"; A="Hope-Desk-Production" ;;
            manager)    P="HopeDeskManager";    S="Hope Desk Manager";    V="Hope Desk Manager";    A="Hope-Desk-Manager" ;;
          esac
          {
            echo "APP_PRODUCT=$P"
            echo "APP_SHIPPED=$S"
            echo "VOLNAME=$V"
            echo "ARTIFACT=$A"
          } >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.variant }}-aarch64
          path: arm

      - name: Download x86_64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.variant }}-x86_64
          path: x86

      - name: Unzip
        run: |
          ditto -x -k "arm/$APP_PRODUCT.app.zip" arm
          ditto -x -k "x86/$APP_PRODUCT.app.zip" x86

      - name: Lipo-merge into a universal bundle
        env:
          HOPE_DESK_BUNDLE_VERSION: hd2.${{ github.run_number }}
        run: |
          mkdir -p out
          bash res/hope-desk/lipo-merge.sh "arm/$APP_PRODUCT.app" "x86/$APP_PRODUCT.app" "out/$APP_SHIPPED.app"
          APP="out/$APP_SHIPPED.app"
          echo "exe:   $(lipo -archs "$APP/Contents/MacOS/$APP_PRODUCT")"
          echo "dylib: $(lipo -archs "$APP/Contents/Frameworks/liblibrustdesk.dylib")"
          if [ "${{ matrix.variant }}" = "production" ]; then
            echo "service: $(lipo -archs "$APP/Contents/MacOS/service")"
          fi

      - name: Package (zip and unsigned dmg)
        run: |
          brew install create-dmg
          APP="out/$APP_SHIPPED.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARTIFACT.app.zip"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "$VOLNAME" \
            --icon "$APP_SHIPPED.app" 200 190 \
            --hide-extension "$APP_SHIPPED.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "$ARTIFACT.dmg" "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.dmg
            ${{ env.ARTIFACT }}.app.zip
          if-no-files-found: error
          retention-days: 14

  # FALLBACK: separate per-arch DMGs. Runs only when the merge input is off, or when a merge
  # job fails (e.g. the file-set check trips on a Pod). Artifacts are named
  # "<Name>-arm64" / "<Name>-Intel" so they are never mistaken for the universal "<Name>".
  per-arch-fallback:
    name: fallback ${{ matrix.variant }} ${{ matrix.arch }}
    needs: [build, merge]
    if: ${{ always() && needs.build.result == 'success' && (!inputs.merge || needs.merge.result == 'failure') }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'all' && '["staff","production","manager"]' || format('["{0}"]', inputs.variant)) }}
        arch: [aarch64, x86_64]
    steps:
      - name: Per-variant names
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            staff)      P="HopeDesk";           S="Hope Desk";            V="Hope Desk";            A="Hope-Desk" ;;
            production) P="HopeDeskProduction"; S="HopeDeskProduction";   V="Hope Desk Production"; A="Hope-Desk-Production" ;;
            manager)    P="HopeDeskManager";    S="Hope Desk Manager";    V="Hope Desk Manager";    A="Hope-Desk-Manager" ;;
          esac
          SUFFIX="arm64"; [ "${{ matrix.arch }}" = "x86_64" ] && SUFFIX="Intel"
          {
            echo "APP_PRODUCT=$P"
            echo "APP_SHIPPED=$S"
            echo "VOLNAME=$V"
            echo "ARTIFACT=$A-$SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.variant }}-${{ matrix.arch }}
          path: in

      - name: Package per-arch dmg
        run: |
          mkdir -p out
          ditto -x -k "in/$APP_PRODUCT.app.zip" in
          mv "in/$APP_PRODUCT.app" "out/$APP_SHIPPED.app"
          brew install create-dmg
          ditto -c -k --sequesterRsrc --keepParent "out/$APP_SHIPPED.app" "$ARTIFACT.app.zip"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "$VOLNAME" \
            --icon "$APP_SHIPPED.app" 200 190 \
            --hide-extension "$APP_SHIPPED.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "$ARTIFACT.dmg" "out/$APP_SHIPPED.app"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.dmg
            ${{ env.ARTIFACT }}.app.zip
          if-no-files-found: error
          retention-days: 14
